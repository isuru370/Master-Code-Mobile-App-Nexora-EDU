org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
dev.steenbakker.mobile_scanner.useUnbundled=true

# Windows: the project (D:) and the pub cache (C:) are on different drives, so
# Kotlin's incremental cache cannot store plugin paths and prints long
# "this and base files have different roots" errors (the build still works).
# Compiling the plugins without that cache stops it.
kotlin.incremental=false
